<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">IPMG</title>
  <style>
    .pulse { transform-origin: 48px 48px; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: .7; } to { transform: scale(1.55); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <circle class="pulse" cx="48" cy="48" r="29" fill="none" stroke="#2a78d6" stroke-width="3"/>
  <circle cx="48" cy="48" r="29" fill="none" stroke="#2a78d6" stroke-width="6"/>
  <circle cx="48" cy="48" r="11" fill="#2a78d6"/>
</svg>
