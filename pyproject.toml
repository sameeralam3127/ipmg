# ==========================================================
# Build System
# ==========================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


# ==========================================================
# Project Metadata
# ==========================================================

[project]
name = "ipmg"
version = "3.1.3"  # Managed automatically by semantic-release
description = "IP Management & Ping Monitoring CLI Tool"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Sameer Alam" }
]

maintainers = [
    { name = "Sameer Alam", email = "sameeralam3127@gmail.com" }
]

keywords = ["ip", "network", "ping", "monitoring", "cli", "port-scan", "network-scanner", "ping-sweep", "subnet-scanner", "homelab", "sysadmin"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Monitoring",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

# The core is what a scan needs: the terminal UI, Excel reports and input,
# and the config file parser. IPMG Web's server stack is the `web` extra.
dependencies = [
    "openpyxl>=3.1",
    "rich>=13.0",
    # tomllib is in the standard library from 3.11; tomli 2.x is the same
    # parser with the same API, so the floor must not drop below it.
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://sameeralam3127.github.io/ipmg/"
Documentation = "https://github.com/sameeralam3127/ipmg#readme"
Repository = "https://github.com/sameeralam3127/ipmg"
Issues = "https://github.com/sameeralam3127/ipmg/issues"
Changelog = "https://github.com/sameeralam3127/ipmg/releases"

[project.optional-dependencies]
# IPMG Web (`ipmg web`): the browser UI, its REST API, and /metrics.
web = [
    "fastapi>=0.110",
    "pydantic>=2.7",
    "uvicorn>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",
]
# Everything; what the one-line installers and the Docker image install.
all = ["ipmg[web]"]
dev = [
    "ipmg[web]",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.5.0",
    "python-semantic-release>=10.5.3",
    "httpx>=0.27",
]

[project.scripts]
ipmg = "ipmg.cli.commands:run"


# ==========================================================
# Development Dependencies (uv)
# ==========================================================

[dependency-groups]
dev = [
    "ipmg[web]",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.5.0",
    "python-semantic-release>=10.5.3",
    "httpx>=0.27",
]


# ==========================================================
# Semantic Release Configuration
# ==========================================================

# Publishing is done by the workflow (pypa/gh-action-pypi-publish), not by
# semantic-release itself.
[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/ipmg/__init__.py:__version__"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
build_command = "python -m build"
major_on_zero = false

[tool.semantic_release.changelog.default_templates]
changelog_file = ".github/CHANGELOG.md"


# ==========================================================
# Setuptools (src layout)
# ==========================================================

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ipmg.web" = ["static/*.html", "static/css/*.css", "static/js/*.js"]


# ==========================================================
# Testing
# ==========================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ipmg"]
branch = true

[tool.coverage.report]
# Current coverage is ~95%; this floor catches a large untested addition.
fail_under = 90


# ==========================================================
# Ruff
# ==========================================================

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["ipmg"]


# ==========================================================
# Black
# ==========================================================

[tool.black]
line-length = 100
target-version = ["py39"]
