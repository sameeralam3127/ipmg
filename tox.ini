# Run the CI checks locally. tox-uv is installed automatically and fetches any
# Python version you don't have, so every environment below works on one machine.
#
#   tox                     every environment
#   tox -e py312            tests on one Python version
#   tox -e lint,lowest      what the Quality workflow checks
#   tox -p                  everything, in parallel

[tox]
requires =
    tox>=4.19
    tox-uv>=1.11
env_list = py3{9,10,11,12,13,14}, lint, lowest, coverage

[testenv]
description = run the test suite
extras = dev
set_env =
    PYTEST_DISABLE_PLUGIN_AUTOLOAD = 1
commands =
    pytest -q -p no:cacheprovider {posargs}

[testenv:lowest]
description = run the tests with the oldest dependency versions pyproject.toml allows
base_python = py39
uv_resolution = lowest-direct

[testenv:coverage]
description = run the tests with coverage (fails below fail_under in pyproject.toml)
base_python = py312
commands =
    pytest -q -p pytest_cov --cov --cov-report=term-missing:skip-covered {posargs}

[testenv:lint]
description = run every pre-commit hook on every file
skip_install = true
deps = pre-commit
set_env =
commands =
    pre-commit run --all-files --show-diff-on-failure
