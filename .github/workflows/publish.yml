name: Publish

on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
    # A docs-only PR cannot break the package, so it skips the 8-job matrix.
    paths-ignore:
      - "**.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only by default; only the release job is granted write access.
permissions:
  contents: read

# A new push to a PR supersedes its previous run. Runs on main queue instead:
# cancelling one mid-release could leave a tag and GitHub release whose
# version never reached PyPI or GHCR.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Every Python version and OS the package claims to support, so a
    # "works on my 3.10" change cannot ship a broken install to anyone else.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # uv resolves and installs the dev extra in seconds, where pip took
      # most of a minute per job; its cache is shared across the matrix.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]" build

      # One cell measures coverage, instead of a separate job running the
      # whole suite a ninth time. Fails below fail_under in pyproject.toml.
      - name: Run tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          if [ "$COVERAGE" = "true" ]; then
            pytest -q -p pytest_cov --cov --cov-report=term-missing:skip-covered
          else
            pytest -q
          fi

      - name: Smoke-test the installed CLI
        run: |
          ipmg --version
          ipmg --input 127.0.0.1 --no-history --formats csv --output smoke

      # A release gate (#97): a type error stops the release like a failing test.
      - name: Type-check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: mypy

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m build

  core-install:
    # `pip install ipmg`, no extras: the lean core must scan and write every
    # report on its own, and must not have pulled the web stack or pandas in.
    name: core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the core only
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install .

      - name: No web stack, no pandas
        run: |
          for module in pandas numpy fastapi uvicorn pydantic; do
            if /tmp/core/bin/python -c "import $module" 2>/dev/null; then
              echo "::error::the core install pulled in $module"; exit 1
            fi
          done

      - name: Scan and write every report format
        run: |
          /tmp/core/bin/ipmg --input 127.0.0.1 --no-history --output core \
            --formats xlsx csv json jsonl md --fail-on-down
          ls core_*.xlsx core_*.csv core_*.json core_*.jsonl core_*.md

      - name: ipmg web explains the missing extra
        run: |
          if /tmp/core/bin/ipmg web --no-browser > web.txt 2>&1; then
            echo "::error::ipmg web started without the web extra"; exit 1
          fi
          grep -q "ipmg\[web\]" web.txt

  release-assets:
    # The release job's checksums step, run on every change: the script that
    # collects the assets and writes SHA256SUMS must work before a release
    # depends on it, and the installer workflows test against its output.
    name: release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build and collect the release assets
        run: |
          uv build --out-dir dist
          .github/scripts/release-assets.sh dist release-assets

      - name: SHA256SUMS covers every asset and every hash matches
        working-directory: release-assets
        run: |
          sha256sum -c SHA256SUMS
          for asset in install.sh install.ps1 requirements-web.txt ipmg-*.whl ipmg-*.tar.gz; do
            grep -q "  $asset\$" SHA256SUMS || { echo "::error::SHA256SUMS does not list $asset"; exit 1; }
          done
          test "$(wc -l < SHA256SUMS)" -eq "$(find . -type f ! -name SHA256SUMS | wc -l)"

  release:
    needs: [test, core-install, release-assets]
    # main cuts releases; v4 cuts 4.0.0 betas (the branch groups in pyproject.toml).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v4')
    runs-on: ubuntu-latest
    environment: pypi

    # contents: push the release commit, tag and GitHub release.
    # id-token: PyPI trusted publishing (OIDC), and the signing identity for
    # the build attestations.
    # attestations: record those attestations against the release's files.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Force branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Create semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          build: false

      - name: Build release distributions
        if: steps.release.outputs.released == 'true'
        run: python -m build

      # The wheel and sdist, both installers as they are at the release tag,
      # a hash-pinned dependency list, and SHA256SUMS over all of them. The
      # installers check what they download against this file.
      - name: Set up uv
        if: steps.release.outputs.released == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Collect the release assets and write SHA256SUMS
        if: steps.release.outputs.released == 'true'
        run: .github/scripts/release-assets.sh dist release-assets

      # Proves each file was built by this workflow, which a checksum hosted
      # next to the file cannot: `gh attestation verify FILE --repo ...`.
      - name: Attest the release assets
        if: steps.release.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Upload GitHub release assets
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      # The wheel and sdist are already attached by the step above.
      - name: Upload the installers and checksums
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release upload "$TAG" --clobber \
            release-assets/install.sh \
            release-assets/install.ps1 \
            release-assets/requirements-web.txt \
            release-assets/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.release.outputs.released == 'true'
        with:
          packages-dir: dist

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

  # The container image for the release just cut. Separate jobs, because they
  # need packages: write, and because the tag semantic-release pushed does not
  # trigger other workflows (pushes made with GITHUB_TOKEN never do).
  #
  # Each platform builds natively on its own runner (no QEMU), is smoke-tested
  # there, and is pushed by digest; docker-manifest then tags both as one image.
  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    name: docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Platform name for artifacts and the cache
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and smoke-tested first, so a broken image is never pushed.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ipmg:release
          cache-from: type=gha,scope=docker-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.platform.outputs.pair }}

      - name: Smoke-test the image
        run: .github/scripts/docker-smoke.sh ipmg:release

      # A cache hit: the layers were all built by the step above.
      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=docker-${{ steps.platform.outputs.pair }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [release, docker]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      # Secrets cannot be read in a step's `if:`, so expose whether they are set.
      # Forks have neither, and skip Docker Hub.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ipmg

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub skipped
        if: env.DOCKERHUB_ENABLED != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set, so the image is published to GHCR only."

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}
            type=raw,value=beta,enable=${{ contains(needs.release.outputs.version, '-beta') }}

      - name: Tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          if [ "$DOCKERHUB_ENABLED" = "true" ]; then
            docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION"
            # Both registries must serve the same manifest list.
            ghcr=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')
            hub=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')
            if [ "$ghcr" != "$hub" ]; then
              echo "::error::GHCR ($ghcr) and Docker Hub ($hub) digests differ for $VERSION"
              exit 1
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOCKERHUB_ENABLED == 'true'
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Sync the Docker Hub description from the README
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/ipmg
          readme-filepath: ./README.md
          short-description: Find out which hosts on your network are up, and what changed since last time.
