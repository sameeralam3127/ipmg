name: Docker

# Builds the image and smoke-tests it on every change that could affect it.
# Publishing to GHCR happens in publish.yml, only when a release is cut.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
      - .github/scripts/docker-smoke.sh
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
      - .github/scripts/docker-smoke.sh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # arm64 is built but not run: QEMU is enough to prove it builds, and the
      # smoke test below exercises the same Dockerfile natively on amd64.
      - name: Build for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ipmg:ci
          cache-from: type=gha

      - name: Smoke-test the image
        run: .github/scripts/docker-smoke.sh ipmg:ci
