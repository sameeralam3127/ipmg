name: Docker

# Builds the image and smoke-tests it on every change that could affect it.
# Publishing to GHCR happens in publish.yml, only when a release is cut.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
      - .github/scripts/docker-smoke.sh
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
      - .github/scripts/docker-smoke.sh

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# A new push to a PR supersedes its previous build; runs on main always finish.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Each platform builds and is smoke-tested natively on its own runner:
    # arm64 under QEMU was the slowest step of every run, and was never run.
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Platform name for the cache
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The same cache scope the release build uses, so a release after a
      # merged PR rebuilds nothing.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ipmg:ci
          cache-from: type=gha,scope=docker-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.platform.outputs.pair }}

      - name: Smoke-test the image
        run: .github/scripts/docker-smoke.sh ipmg:ci
