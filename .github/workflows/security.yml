name: Security

# No paths-ignore here: the secret scan must cover every file, docs included.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its previous scan; runs on main always finish.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scanners
        run: pip install bandit pip-audit detect-secrets

      - name: Static security analysis (bandit)
        run: bandit -r src

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secret scan (detect-secrets)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
