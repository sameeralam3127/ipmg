name: Security

# No paths-ignore here: the secret scan must cover every file, docs included.
on:
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
  # Weekly, so a newly disclosed CVE in a dependency shows up without
  # waiting for the next push.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its previous scan; runs on main always finish.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scanners
        run: pip install bandit pip-audit detect-secrets

      - name: Static security analysis (bandit)
        run: bandit -r src

      # What users actually install: IPMG with every extra, resolved by pip
      # from pyproject.toml in a fresh environment, then audited at exactly
      # the versions that resolved. pip freeze leaves out pip and setuptools,
      # which come with the virtualenv, not with IPMG, and the editable IPMG.
      - name: Install IPMG to audit
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet -e ".[dev]"
          "$RUNNER_TEMP/audit/bin/pip" freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit --requirement "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip \
            --progress-spinner off

      - name: Secret scan (detect-secrets)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
