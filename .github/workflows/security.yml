name: Security

# No paths-ignore here: the secret scan must cover every file, docs included.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its previous scan; runs on main always finish.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scanners
        run: pip install bandit pip-audit detect-secrets

      - name: Static security analysis (bandit)
        run: bandit -r src

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secret scan (detect-secrets)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
