name: Quality

# Checks that complement the test matrix in publish.yml. No paths-ignore, so
# every check reports on every PR and can be marked as required.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # The same hooks contributors run locally (.pre-commit-config.yaml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

  completion:
    # The shell completion tests skip any shell that is not installed; here
    # bash, zsh, fish, and PowerShell (preinstalled on the runner) all are,
    # and a skipped test fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish

      - name: Install IPMG
        run: pip install -e ".[dev]"

      - name: Test completion in every shell
        run: |
          bash --version | head -1; zsh --version; fish --version; pwsh --version
          pytest -q -rs tests/test_completion.py | tee completion.txt
          if grep -q SKIPPED completion.txt; then
            echo "::error::a shell was missing, so its completion was not tested"; exit 1
          fi

  services:
    # The contrib/ service templates, checked by systemd itself. The units
    # name /usr/local/bin/ipmg and the ipmg user, so both are put in place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install IPMG where the templates expect it
        run: |
          python -m venv "$RUNNER_TEMP/ipmg"
          "$RUNNER_TEMP/ipmg/bin/pip" install ".[web]"
          sudo ln -s "$RUNNER_TEMP/ipmg/bin/ipmg" /usr/local/bin/ipmg
          sudo useradd --system --home-dir /var/lib/ipmg --shell /usr/sbin/nologin ipmg

      - name: systemd-analyze verify
        run: systemd-analyze verify contrib/systemd/*.service contrib/systemd/*.timer

  lowest-deps:
    # The oldest Python and the oldest version of every dependency that
    # pyproject.toml allows, so a floor like pandas>=2.2.2 is known to work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.9"

      - name: Install the lowest allowed dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --no-sync pytest -q -p no:cacheprovider

  types:
    # mypy becomes a release gate in v4 (#97). Until then this only records
    # the baseline: it reports the error count and never fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install IPMG and mypy
        run: uv pip install --system -e ".[web]" mypy

      - name: Type-check (non-blocking)
        run: |
          mypy src/ --ignore-missing-imports | tee mypy.txt || true
          {
            echo "## mypy baseline"
            echo
            echo "\`$(tail -1 mypy.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"
