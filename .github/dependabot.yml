version: 2

updates:
  # Keeps the SHA-pinned actions in .github/workflows current. Grouped into a
  # single weekly PR so updates do not flood the Actions queue.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: build
      include: scope
